<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
	* { box-sizing: border-box; margin: 0; }
	html, body { width: 2560px; height: 960px; overflow: hidden; }
	body { position: relative; background: var(--bg, #0f0f11); }
	/* Левая часть со знаком и надписью берётся из прежнего баннера как есть. */
	.left { position: absolute; inset: 0; background-repeat: no-repeat; background-size: 2560px 960px; }
	.right {
		position: absolute; left: 1160px; top: 0; width: 1400px; height: 960px; overflow: hidden;
		background: var(--bg, #0f0f11);
		-webkit-mask-image: linear-gradient(90deg, transparent 0, #000 120px);
	}
	.stage {
		position: absolute; left: 150px; top: -150px;
		transform: perspective(2600px) rotateX(12deg) rotateY(-10deg) rotateZ(-8deg);
		transform-origin: 0 0;
		display: flex; gap: 30px;
	}
	.col { display: flex; flex-direction: column; gap: 30px; }
	.col:nth-child(2) { margin-top: 110px; }
	.col:nth-child(3) { margin-top: 20px; }
	.card {
		width: 480px; height: 180px; border-radius: 18px; overflow: hidden;
		border: 2px solid rgba(255, 255, 255, .08);
		box-shadow: 0 30px 80px rgba(0, 0, 0, .55);
		background: #18181b center / cover no-repeat;
	}
	.shade {
		position: absolute; inset: 0; pointer-events: none;
		background:
			linear-gradient(90deg, var(--bg, #0f0f11) 0, transparent 220px),
			radial-gradient(1400px 900px at 70% 50%, transparent 55%, rgba(0, 0, 0, .35) 100%);
	}
</style>
</head>
<body>
	<div class="left" id="left"></div>
	<div class="right">
		<div class="stage" id="stage"></div>
		<div class="shade"></div>
	</div>
	<script>
		const lang = new URLSearchParams(location.search).get('lang') === 'ru' ? 'ru' : 'en'
		document.getElementById('left').style.backgroundImage = `url(img/profile.${lang}.jpg)`
		const columns = [
			['shkatova-psychologist', 'codenames', 'prestige-logist', 'community-taplist', 'infra-server', 'sublya'],
			['codenames', 'sublya', 'infra-site-template', 'shkatova-psychologist', 'infra-site-kit', 'prestige-logist'],
			['prestige-logist', 'community-taplist', 'infra-server', 'infra-site-kit', 'infra-site-template', 'sublya'],
		]
		const stage = document.getElementById('stage')
		for (const names of columns) {
			const col = document.createElement('div')
			col.className = 'col'
			for (const name of names) {
				const card = document.createElement('div')
				card.className = 'card'
				card.style.backgroundImage = `url(img/${name}.${lang}.jpg)`
				col.append(card)
			}
			stage.append(col)
		}
	</script>
</body>
</html>
